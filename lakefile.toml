name = "wasserstein"
version = "0.1.0"
defaultTargets = ["Wasserstein"]

[leanOptions]
autoImplicit = false
pp.unicode.fun = true
weak.linter.mathlibStandardSet = true
# Mathlib's literal header check only accepts its Apache-only wording.
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"

[[lean_lib]]
name = "Wasserstein"
